ave",interpretColor:e=>e<=4?"#4caf82":e<=10?"#f0a500":e<=17?"#e05a4b":"#c0392b",evidence:{cutoffs:"0–4 = disabilità minima; 5–10 = lieve; 11–17 = moderata; 18–24 = grave. Pazienti con LBP cronico hanno tipicamente punteggi >4; score >14 = disabilità grave (Roland & Morris, 1983; Stratford et al.).",mcid:"MCID = 2–3 punti (cambiamento significativo in LBP acuta e cronica). Riduzione <30% dal baseline non è clinicamente rilevante (Hägg et al., 2003).",mdc:"MDC95 = 5.5 punti (Jordan et al., 2006).",source:"Shirley Ryan AbilityLab – RehabMeasures Database",url:"https://www.sralab.org/rehabilitation-measures/roland-morris-disability-questionnaire",refs:["Roland M, Morris R. Spine 1983;8(2):141–144.","Hägg O et al. Eur Spine J 2003;12(1):102–108.","Jordan K et al. Rheumatology 2006;45(11):1429–1433.","Stratford PW et al. Phys Ther 1996;76(4):359–367."]}},NDI:{name:"NDI – Disabilità Cervicale",color:"#b5651d",description:"Neck Disability Index (10 item, 0–50 → percentuale; 0% = nessuna disabilità)",type:"questionnaire",items:["Intensità del dolore al collo","Cura personale (lavarsi, vestirsi, ecc.)","Sollevamento pesi","Lettura","Mal di testa","Concentrazione","Lavoro","Guida dell'auto","Sonno","Attività ricreative"],options:["Nessun problema (0)","Problema lieve (1)","Problema moderato (2)","Problema abbastanza grave (3)","Problema grave (4)","Problema molto grave (5)"],optionValues:[0,1,2,3,4,5],min:0,max:50,scoreTransform:e=>Math.round(e/50*100),interpret:e=>e<=8?"Nessuna disabilità (0–8%)":e<=28?"Disabilità lieve (10–28%)":e<=48?"Disabilità moderata (30–48%)":e<=64?"Disabilità grave (50–64%)":"Disabilità completa (70–100%)",interpretColor:e=>e<=8?"#4caf82":e<=28?"#f0a500":e<=48?"#e05a4b":"#c0392b",evidence:{cutoffs:"Punteggio espresso in % (punteggio grezzo × 2): 0–8% = nessuna disabilità; 10–28% = lieve; 30–48% = moderata; 50–64% = grave; 70–100% = disabilità completa (Vernon & Mior, 1991; Vernon, 2008).",mcid:"MCID = 8.5–10 punti (su scala 0–50) per cervicobrachialgia (Young et al., 2010). Range riportato in letteratura: 5.5–18 pt a seconda della popolazione e del tipo di intervento (MacDermid et al., 2009).",mdc:"MDC = 10.2–13.4 punti (0–50) per cervicobrachialgia; MDC = 19.6% (scala 0–100) per disturbi meccanici del collo (Young et al., 2009).",source:"Shirley Ryan AbilityLab – RehabMeasures Database / NDI MCID Recommendation",url:"https://www.sralab.org/rehabilitation-measures/neck-disability-index",refs:["Vernon H, Mior S. J Manipulative Physiol Ther 1991;14(7):409–415.","MacDermid JC et al. J Orthop Sports Phys Ther 2009;39(5):400–417.","Young BA et al. Spine J 2009;9(10):802–808.","Young IA et al. J Orthop Sports Phys Ther 2010;40(8):502–511."]}},NRS:{name:"NRS – Dolore",color:"#e05a4b",description:"Numeric Rating Scale per il dolore a riposo e durante il movimento (0–10)",type:"nrs",min:0,max:10,step:1,interpret:e=>e<=3?"Lieve":e<=6?"Moderato":"Severo",interpretColor:e=>e<=3?"#4caf82":e<=6?"#f0a500":"#e05a4b",evidence:{cutoffs:"0 = assenza di dolore; 1–3 = lieve; 4–6 = moderato; 7–10 = severo (Hanley et al., 2006; Forchheimer et al., 2011).",mcid:"Dolore cronico muscoloscheletrico: 1 punto o 15% (Salaffi et al., 2004). Lombalgia: 1.5 pt a 1 settimana, 2.2 pt a 4 settimane di fisioterapia (Childs et al., 2005). Post-chirurgico: riduzione ≥35% = sollievo minimo (Sloman et al., 2006).",mdc:"MDC95 = 2 punti (lombalgia, Childs et al., 2005).",source:"Shirley Ryan AbilityLab – RehabMeasures Database",url:"https://www.sralab.org/rehabilitation-measures/numeric-pain-rating-scale",refs:["Childs JD et al. Spine 2005;30(11):1331–1334.","Farrar JT et al. Pain 2001;94(2):149–158.","Forchheimer MB et al. Arch Phys Med Rehabil 2011;92(3):419–424.","Hanley MA et al. J Pain 2006;7(2):129–133.","Salaffi F et al. Eur J Pain 2004;8(4):283–291.","Sloman R et al. Pain Manag Nurs 2006;7(4):153–158."]}},TSK:{name:"TSK-11 – Kinesiofobia",color:"#7c5cbf",description:"Tampa Scale of Kinesiophobia (11 item, range 11–44)",type:"questionnaire",items:["Ho paura che potrei infortunarmi se faccio esercizio fisico.","Se dovessi tentare di superare il dolore, esso aumenterebbe.","Il mio corpo mi sta dicendo che c'è qualcosa di gravemente sbagliato in me.","Il dolore significa sempre che mi sono infortunato.","Non sarebbe sicuro per me fare attività fisica.","Le persone non prendono abbastanza sul serio la mia condizione.","Il mio infortunio ha messo a rischio la mia forma fisica per il resto della mia vita.","Il movimento doloroso indica semplicemente che è necessario del riposo.","Ho paura di infortunarmi accidentalmente.","Essere cauto è il modo migliore per evitare che il dolore peggiori.","Non avrei questo tanto dolore se non ci fosse qualcosa di potenzialmente pericoloso nel mio corpo."],options:["Per niente d'accordo (1)","Poco d'accordo (2)","Abbastanza d'accordo (3)","Molto d'accordo (4)"],optionValues:[1,2,3,4],min:11,max:44,interpret:e=>e<25?"Bassa kinesiofobia":e<37?"Moderata kinesiofobia":"Alta kinesiofobia",interpretColor:e=>e<25?"#4caf82":e<37?"#f0a500":"#e05a4b",evidence:{cutoffs:"TSK-11: ≤22 = minima; 23–28 = bassa; 29–35 = moderata; ≥36 = alta kinesiophobia (Heathcote et al., 2021, Frontiers in Pain Research).",mcid:"Riduzione ≥4 punti considerata clinicamente significativa (letteratura su popolazione muscoloscheletrica).",mdc:"Non standardizzato per TSK-11; utilizzare variazione ≥4 pt come soglia conservativa.",source:"Shirley Ryan AbilityLab – RehabMeasures Database (Fear-Avoidance Beliefs)",url:"https://www.sralab.org/rehabilitation-measures/fear-avoidance-beliefs-questionnaire",refs:["Heathcote LC et al. Front Pain Res 2021;2:739051.","Vlaeyen JWS et al. Pain 1995;62(3):363–372.","Woby SR et al. Eur J Pain 2005;9(3):279–286."]}},SF12:{name:"SF-12 – Stato di Salute",color:"#e67e22",description:"Short Form-12: punteggi PCS e MCS (componente fisica e mentale, 0–100; 50 = norma)",type:"sf12",items:[{q:"In generale, direbbe che la sua salute è:",opts:["Eccellente","Molto buona","Buona","Discreta","Cattiva"]},{q:"Le seguenti attività fisiche: ATTIVITÀ MODERATA (spostare un tavolo, passare l'aspirapolvere, giocare a bowling). La sua salute la limita in queste attività? Se sì, quanto?",opts:["Sì, molto limitato/a","Sì, un po' limitato/a","No, per niente limitato/a"]},{q:"Le seguenti attività fisiche: SALIRE ALCUNE RAMPE DI SCALE. La sua salute la limita in queste attività? Se sì, quanto?",opts:["Sì, molto limitato/a","Sì, un po' limitato/a","No, per niente limitato/a"]},{q:"Nelle ultime 4 settimane ha reso MENO di quanto avrebbe voluto nel lavoro o in altre attività, A CAUSA DI PROBLEMI FISICI?",opts:["Sì","No"]},{q:"Nelle ultime 4 settimane ha avuto limitazioni nel tipo di lavoro o in altre attività, A CAUSA DI PROBLEMI FISICI?",opts:["Sì","No"]},{q:"Nelle ultime 4 settimane ha reso MENO di quanto avrebbe voluto nel lavoro o in altre attività, A CAUSA DI PROBLEMI EMOTIVI (es. sentirsi ansioso/a o depresso/a)?",opts:["Sì","No"]},{q:"Nelle ultime 4 settimane ha svolto il lavoro o le altre attività con MENO CURA del solito, A CAUSA DI PROBLEMI EMOTIVI?",opts:["Sì","No"]},{q:"Nelle ultime 4 settimane, in che misura il DOLORE FISICO ha interferito con il suo lavoro normale (compreso il lavoro fuori casa e quello domestico)?",opts:["Per niente","Pochissimo","Un po'","Abbastanza","Moltissimo"]},{q:"Queste domande riguardano come si è sentito/a nelle ultime 4 settimane. CALMO/A E SERENO/A:",opts:["Sempre","Quasi sempre","Spesso","Qualche volta","Raramente","Mai"]},{q:"Nelle ultime 4 settimane: PIENO/A DI ENERGIA:",opts:["Sempre","Quasi sempre","Spesso","Qualche volta","Raramente","Mai"]},{q:"Nelle ultime 4 settimane: GIÙ DI MORALE:",opts:["Sempre","Quasi sempre","Spesso","Qualche volta","Raramente","Mai"]},{q:"Nelle ultime 4 settimane, quanto spesso la sua salute fisica o i suoi problemi emotivi hanno interferito con le sue attività sociali (come visitare amici, parenti, ecc.)?",opts:["Sempre","Quasi sempre","Qualche volta","Raramente","Mai"]}],min:0,max:100,interpret:e=>e>=47?"Nella norma":e>=37?"Lievemente sotto la norma":"Significativamente sotto la norma",interpretColor:e=>e>=47?"#4caf82":e>=37?"#f0a500":"#e05a4b",evidence:{cutoffs:"Norma di riferimento: punteggio medio = 50 (DS = 10) per la popolazione generale. PCS <47 o MCS <47 indica stato di salute sotto la norma; <37 indica compromissione significativa (>1 DS sotto la media).",mcid:"MCID stimato a 3–5 punti per PCS e MCS in condizioni muscoloscheletriche croniche (Ware et al., 1996; Gandek et al., 1998).",mdc:"MDC ≈ 3 punti (basato su SEM della versione normata).",source:"Shirley Ryan AbilityLab – RehabMeasures Database",url:"https://www.sralab.org/rehabilitation-measures",refs:["Ware JE Jr et al. Med Care 1996;34(3):220–233.","Gandek B et al. J Clin Epidemiol 1998;51(11):1167–1170.","Jenkinson C et al. J Public Health 1997;19(2):220–224."]}},BERG:{name:"Berg Balance Scale",color:"#2e7d9a",description:"Valutazione equilibrio funzionale – 14 item, 0–56 (56 = equilibrio ottimale)",type:"questionnaire",items:["1. SEDUTO → IN PIEDI: dalla posizione seduta a quella eretta senza usare le mani","2. IN PIEDI SENZA SUPPORTO: stare in piedi per 2 minuti senza appoggio","3. SEDUTO SENZA SCHIENALE: seduto senza appoggio per 2 minuti, piedi a terra","4. IN PIEDI → SEDUTO: sedersi controllando il movimento","5. TRASFERIMENTI: spostarsi da sedia con braccioli a sedia senza (e viceversa)","6. IN PIEDI CON OCCHI CHIUSI: stare in piedi per 10 sec con occhi chiusi","7. IN PIEDI CON PIEDI UNITI: stare in piedi con piedi uniti per 1 minuto senza appoggio","8. RAGGIUNGERE IN AVANTI: braccio a 90°, raggiungere il più avanti possibile (misurare cm)","9. RACCOGLIERE OGGETTO DA TERRA: raccogliere una scarpa/oggetto davanti ai piedi","10. GIRARSI A GUARDARE INDIETRO: ruotare il tronco per guardare dietro sinistra/destra","11. GIRARSI DI 360°: fare un giro completo su se stesso (360°) in ciascuna direzione","12. APPOGGIO ALTERNATO SU SCALINO: appoggiare alternativamente i piedi su uno scalino (8 volte)","13. IN PIEDI CON UN PIEDE AVANTI: un piede direttamente davanti all'altro per 30 sec","14. IN PIEDI SU UN PIEDE SOLO: stare in equilibrio su un solo piede il più a lungo possibile"],options:["0 – Incapace / richiede molta assistenza","1 – Richiede assistenza moderata","2 – Richiede minima assistenza / supervisione","3 – Completa con minima supervisione","4 – Esegue in modo indipendente e sicuro"],optionValues:[0,1,2,3,4],min:0,max:56,interpret:e=>e>=41?"Basso rischio cadute (indipendente)":e>=21?"Medio rischio cadute (cammino con assistenza)":"Alto rischio cadute (carrozzina)",interpretColor:e=>e>=41?"#4caf82":e>=21?"#f0a500":"#e05a4b",evidence:{cutoffs:"41–56 = basso rischio cadute (indipendente); 21–40 = medio rischio (cammino con assistenza); 0–20 = alto rischio (necessita carrozzina). Cut-off <45 = maggior rischio cadute (Berg 1992); <36 = rischio cadute quasi 100% (Shumway-Cook 1997).",mcid:"MDC dipende dal punteggio iniziale: score 45–56 → MDC = 4 pt; score 35–44 o 0–25 → MDC = 5 pt; score 25–34 → MDC = 7 pt (Donoghue & Stokes, 2009).",mdc:"MDC95 = 4–7 punti secondo il punteggio basale. ICC intra-rater = 0.98 (Berg 1992).",source:"Shirley Ryan AbilityLab – RehabMeasures Database / Berg Balance Scale",url:"https://www.sralab.org/rehabilitation-measures/berg-balance-scale",refs:["Berg KO et al. Can J Public Health 1992;83(S2):S7–11.","Shumway-Cook A et al. Phys Ther 1997;77(8):812–819.","Donoghue D, Stokes EK. Disabil Rehabil 2009;31(23):1980–1987.","Riddle DL, Stratford PW. Phys Ther 1999;79(10):939–948."]}},FIQR:{name:"FIQR – Fibromialgia",color:"#7b3fa0",description:"Revised Fibromyalgia Impact Questionnaire – 21 item, 0–100 (100 = massimo impatto)",type:"fiqr",domains:[{label:"Funzione (9 item)",key:"function",divisor:3,items:["Pettinarsi / lavarsi i capelli","Camminare continuamente per 20 minuti","Preparare un pasto","Passare l'aspirapolvere / spazzare il pavimento","Sollevare e trasportare una borsa della spesa piena","Salire una rampa di scale","Cambiare le lenzuola del letto","Stare seduto/a su una sedia per 45 minuti","Fare la spesa al supermercato"]},{label:"Impatto globale (2 item)",key:"impact",divisor:1,items:["Quanto la fibromialgia ha interferito con la tua capacità di raggiungere i tuoi obiettivi negli ultimi 7 giorni?","Quanto ti sei sentito/a sopraffatto/a dalla fibromialgia negli ultimi 7 giorni?"]},{label:"Sintomi (10 item)",key:"symptoms",divisor:2,items:["Dolore","Energia (affaticamento)","Rigidità muscolare","Qualità del sonno (quanto ti sei sentito/a riposato/a al mattino)","Depressione","Problemi di memoria","Ansia","Sensibilità al tatto (dolorabilità)","Equilibrio","Sensibilità ambientale (luce, rumore, freddo, caldo)"]}],min:0,max:100,interpret:e=>e<=39?"Impatto lieve":e<=59?"Impatto moderato":e<=75?"Impatto grave":"Impatto molto grave",interpretColor:e=>e<=39?"#4caf82":e<=59?"#f0a500":e<=75?"#e05a4b":"#c0392b",evidence:{cutoffs:"0–39 = impatto lieve; 40–59 = moderato; 60–75 = grave; >75 = molto grave. Pazienti FM tipici: media ~56.6 ± 19.9; soggetti sani: ~12 (Bennett et al., 2009).",mcid:"MCID = 14% del punteggio totale (Bennett et al., 2009). Per un paziente con score 70, variazione ≥9.8 pt è clinicamente rilevante.",mdc:"ICC test-retest eccellente (0.87–0.99); SDC ≈ 11.2 punti per il punteggio totale.",source:"Shirley Ryan AbilityLab – RehabMeasures Database (FIQR)",url:"https://www.sralab.org/rehabilitation-measures/revised-fibromyalgia-impact-questionnaire",refs:["Bennett RM et al. Arthritis Res Ther 2009;11(4):R120.","Salaffi F et al. Reumatismo 2009;61(3):190–195.","Paiva ES et al. J Rheumatol 2013;40(8):1409–1415."]}},WELLS_DVT:{name:"Wells DVT – Probabilità TVP",color:"#c0392b",description:"Wells Criteria for DVT – stima probabilità pre-test trombosi venosa profonda",type:"checklist",items:[{label:"Cancro attivo (in trattamento o negli ultimi 6 mesi, o cure palliative)",points:1},{label:"Paralisi, paresi o immobilizzazione recente in gesso dell'arto inferiore",points:1},{label:"A gilità (vertebrale, femore, polso, omero)",points:1},{label:"Genitore con frattura di femore",points:1},{label:"Fumo attivo (attualmente fumatore/trice)",points:1},{label:"Terapia prolungata con glucocorticoidi (>5 mg prednisone/die per >3 mesi)",points:1},{label:"Artrite reumatoide",points:1},{label:"Osteoporosi secondaria (diabete tipo 1, osteogenesi imperfetta, ipogonadismo, menopausa precoce <45aa, malnutrizione cronica, malassorbimento, epatopatia cronica)",points:1},{label:"Alcol ≥3 unità/die",points:1}],min:0,max:7,interpret:e=>e<=1?"Basso rischio – monitoraggio":e<=3?"Rischio intermedio – valutare MOC":"Alto rischio – MOC + valutazione terapia",interpretColor:e=>e<=1?"#4caf82":e<=3?"#f0a500":"#e05a4b",evidence:{cutoffs:"Il FRAX completo richiede una piattaforma online (sheffield.ac.uk/FRAX) con dati BMD. Questa checklist identifica i fattori di rischio clinici per orientare l'invio a MOC. Soglie terapeutiche: rischio frattura maggiore ≥20% o rischio frattura femore ≥3% a 10 anni.",mcid:"N/A – strumento di screening. Il calcolo percentuale esatto richiede FRAX online (WHO) con dati BMD.",mdc:"N/A – strumento di screening per invio a diagnostica.",source:"WHO / FRAX – Fracture Risk Assessment Tool",url:"https://www.sheffield.ac.uk/FRAX",refs:["Kanis JA et al. Osteoporos Int 2008;19(4):385–397.","Compston J et al. Arch Osteoporos 2022;17(1):75 (NOGG guidelines).","Camacho PM et al. Endocr Pract 2020;26(S1):1–46."]}},MIDAS:{name:"MIDAS – Disabilità Emicrania",color:"#b5651d",description:"Migraine Disability Assessment – giorni persi ultimi 3 mesi (0–270; grado I–IV)",type:"midas",items:["Q1. Quanti giorni nelle ultime 3 settimane hai mancato il lavoro o la scuola per l'emicrania? (0–90 giorni)","Q2. Quanti giorni il lavoro o la scuola è stato ridotto di almeno la metà per l'emicrania? (0–90 giorni)","Q3. Quanti giorni non hai svolto le faccende domestiche per l'emicrania? (0–90 giorni)","Q4. Quanti giorni le faccende domestiche sono state ridotte di almeno la me isodio)"},{key:"r5",label:"Trauma significativo recente"},{key:"r6",label:"Uso endovenoso di droghe / tossicodipendenza"},{key:"r7",label:"Infezione batterica recente o febbre"},{key:"r8",label:"Immunosoppressione (HIV, trapianto, corticosteroidi cronici)"},{key:"r9",label:"Anestesia a sella (perdita sensibilità perineale)"},{key:"r10",label:"Disfunzione vescicale (ritenzione o incontinenza urinaria)"},{key:"r11",label:"Disfunzione intestinale (incontinenza fecale)"},{key:"r12",label:"Deficit neurologico in uno o entrambi gli arti inferiori (specie se progressivo)"},{key:"r13",label:"Sintomi persistenti > 4 settimane / presentazioni ricorrenti / dolore che peggiora"},{key:"r14",label:"Gravidanza"}]},{key:"yellow",label:"🟡 Yellow Flags",color:"#d97706",bg:"#fffbeb",border:"#fcd34d",note:"Fattori psicosociali prognostici per cronicizzazione e disabilità. Più flags presenti = maggior rischio di esito sfavorevole. Indicano la necessità di un approccio biopsicosociale.",items:[{key:"y1",label:"Catastrofizzazione – tendenza a pensare al peggio scenario possibile"},{key:"y2",label:"Esperienza del dolore come insopportabile; dolore riportato come sproporzionato alla condizione"},{key:"y3",label:"Credenze disfunzionali su dolore e lavoro (es. 'se torno al lavoro il dolore peggiorerà')"},{key:"y4",label:"Preoccupazione eccessiva per la salute; ansia, distress, umore basso"},{key:"y5",label:"Paura del movimento e della re-infortunio (kinesiofobia)"},{key:"y6",label:"Incertezza sul futuro / difficoltà nel fare previsioni sull'andamento"},{key:"y7",label:"Cambiamenti comportamentali o comportamenti ricorrenti legati al dolore"},{key:"y8",label:"Aspettativa che altri (persone o trattamenti) risolvano il problema – passività nel processo di cura"},{key:"y9",label:"Visite seriali a diversi professionisti senza miglioramento"}]},{key:"blue",label:"🔵 Blue Flags",color:"#1d4ed8",bg:"#eff6ff",border:"#93c5fd",note:"Fattori lavorativi percepiti che influenzano il ritorno al lavoro e la mpo di recupero",type:"edema",grades:[{value:1,label:"1+",depth:"≤ 2 mm",rebound:"Immediato",desc:"Lieve fossetta appena rilevabile, senza distorsione visibile. Scompare rapidamente.",color:"#4caf82"},{value:2,label:"2+",depth:"2–4 mm",rebound:"Pochi secondi (< 25 sec)",desc:"Fossetta un po' più profonda, nessuna distorsione visibile. Scompare in 10–25 secondi.",color:"#f0a500"},{value:3,label:"3+",depth:"4–6 mm",rebound:"10–30 secondi",desc:"Fossetta evidente. Può durare più di 1 minuto. L'arto appare gonfio e aumentato di volume.",color:"#e05a4b"},{value:4,label:"4+",depth:"6–8 mm",rebound:"> 20 secondi (2–5 min)",desc:"Fossetta molto profonda. Dura 2–5 minuti. L'arto è grossolanamente distorto.",color:"#c0392b"}],locations:["Caviglia DX","Caviglia SX","Piede DX","Piede SX","Gamba DX (pretibiale)","Gamba SX (pretibiale)","Ginocchio DX","Ginocchio SX","Coscia DX","Coscia SX","Mano DX","Mano SX","Avambraccio DX","Avambraccio SX","Regione sacrale","Regione periorbitale","Addome (anasarca)"],bilateralGrades:[{value:0,label:"Assente",desc:"Nessun edema rilevabile"},{value:1,label:"1+ – Lieve bilaterale",desc:"Entrambe le caviglie/piedi"},{value:2,label:"2+ – Moderato bilaterale",desc:"Piedi, mani, avambracci e gambe"},{value:3,label:"3+ – Grave bilaterale",desc:"Edema generalizzato: gambe, braccia, piedi, viso"}],min:0,max:4,interpret:e=>e===0?"Assente":e===1?"Edema lieve (1+)":e===2?"Edema moderato (2+)":e===3?"Edema grave (3+)":"Edema molto grave (4+)",interpretColor:e=>e===0||e<=1?"#4caf82":e<=2?"#f0a500":"#e05a4b",evidence:{cutoffs:"Metodo 1 (profondità): 1+ ≤2mm scompare rapidamente; 2+ 2–4mm in 10–25 sec; 3+ 4–6mm >1 min, arto gonfio; 4+ 6–8mm 2–5 min, arto distorto (Guelph General Hospital CHF Pathway). Metodo 2 (tempo rebound): Hogan M, Med-Surg Nursing 2007. Metodo 3 (distribuzione bilaterale): UNICEF Nutrition Training.",mcid:"N/A – scala ordinale clinica. La riduzione di almeno 1 grado è considerata clinicamente significativa.",mdc:"Affidabilità inter-rater <script>
// ── Service Worker con auto-aggiornamento ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      reg.update();
      reg.addEventListener('updatefound', function() {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function() {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(function(e) { console.log('SW:', e); });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}

// ── Reset cache: triplo tap angolo alto-sinistro ──
(function() {
  var taps = 0, timer = null;
  document.addEventListener('click', function(ev) {
    if (ev.clientX > 60 || ev.clientY > 60) { taps = 0; return; }
    taps++;
    clearTimeout(timer);
    timer = setTimeout(function() { taps = 0; }, 1200);
    if (taps >= 3) {
      taps = 0;
      if (confirm('Reset cache dell\'app? I dati dei pazienti NON verranno cancellati.')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(rs) {
            rs.forEach(function(r) { r.unregister(); });
          });
        }
        if (window.caches) {
          caches.keys().then(function(ks) {
            return Promise.all(ks.map(function(k) { return caches.delete(k); }));
          }).then(function() { window.location.reload(true); });
        } else { window.location.reload(true); }
      }
    }
  }, true);
})();

// ── Prompt installazione (Android / Chrome / Edge) ──
var qfPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  qfPrompt = e;
  try { if (localStorage.getItem('qf-install-dismissed') === '1') return; } catch(err) {}
  if (document.getElementById('qf-install-banner')) return;
  var bar = document.createElement('div');
  bar.id = 'qf-install-banner';
  bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1a2233;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:14px;box-shadow:0 -4px 20px rgba(0,0,0,.2)';
  bar.innerHTML = '<span style="flex:1">Installa Questionfisio per usarla offline</span><button id="qf-ib" style="padding:8px 18px;border-radius:8px;border:none;background:#4a8fe8;color:#fff;font-weight:700;cursor:pointer;font-size:14px;font-family:Georgia,serif">Installa</button><button id="qf-db" style="padding:8px 12px;border-radius:8px;border:none;background:transparent;color:#8a9bb0;cursor:pointer;font-size:18px">&times;</button>';
  document.body.appendChild(bar);
  document.getElementById('qf-ib').onclick = function() {
    if (!qfPrompt) return;
    qfPrompt.prompt();
    qfPrompt.userChoice.then(function() { qfPrompt = null; bar.remove(); });
  };
  document.getElementById('qf-db').onclick = function() {
    bar.remove();
    try { localStorage.setItem('qf-install-dismissed', '1'); } catch(err) {}
  };
});

// ── Suggerimento iOS ──
(function() {

  if (!isIOS || standalone || dismissed) return;
  window.addEventListener('load', function() {
    setTimeout(function() {
      var bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1a2233;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:13px;box-shadow:0 -4px 20px rgba(0,0,0,.2)';
      bar.innerHTML = '<span style="flex:1">Per installare: tocca <strong>Condividi</strong> poi <strong>Aggiungi alla schermata Home</strong></span><button id="qf-ix" style="padding:6px 12px;border-radius:8px;border:none;background:transparent;color:#8a9bb0;cursor:pointer;font-size:20px">&times;</button>';
      document.body.appendChild(bar);
      document.getElementById('qf-ix').onclick = function() {
        bar.remove();
        try { localStorage.setItem('qf-ios-hint-dismissed', '1'); } catch(e) {}
      };
    }, 2500);
  });
})();
